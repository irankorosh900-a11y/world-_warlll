.card{background:#0b1c2b;border:1px solid #315572;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #0003}  
h1,h2,h3{margin-top:0}  
button,.btn{background:#1976d2;color:#fff;border:0;border-radius:10px;padding:11px 15px;margin:4px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}  
button.secondary,.btn.secondary{background:#294052}  
button.success{background:#168653}  
button.warn{background:#9b6818}  
button.danger{background:#8d2d2d}

.msg{padding:12px;border-radius:10px;background:#14334b;margin:10px 0}.err{background:#4a1d1d}.ok{background:#154a34}  
nav{display:flex;flex-wrap:wrap;gap:5px}nav button{flex:1;min-width:120px}  
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}  
.item{background:#0a1927;border:1px solid #294c66;border-radius:12px;padding:14px}  
.flag{font-size:42px}  
.list{line-height:2}  
.rule{background:#091724;border-right:3px solid #1976d2;padding:12px;margin:9px 0;border-radius:9px}  
pre{white-space:pre-wrap;background:#020a11;padding:16px;border-radius:10px;line-height:1.8;overflow:auto}  
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #294c66;text-align:right}  
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#14334b;margin:3px}
