<style>
*{box-sizing:border-box}
body{
 margin:0;color:#fff;font-family:Tahoma,Arial,sans-serif;
 background:radial-gradient(ellipse at top,#19415b,#071725 55%,#030911);
 background-attachment:fixed
}
.wrap{max-width:1100px;margin:auto;padding:14px}
.card{
 background:linear-gradient(145deg,#0b1c2bf5,#10283af5);
 border:1px solid #315572;border-radius:16px;padding:18px;
 margin:14px 0;box-shadow:0 8px 24px #0005
}
h1,h2,h3{margin-top:0}
button,.btn{
 background:linear-gradient(135deg,#1976d2,#15518a);
 color:white;border:1px solid #4786b5;border-radius:10px;
 padding:11px 15px;margin:4px;font-weight:bold;
 cursor:pointer;text-decoration:none;display:inline-block;
 font-family:inherit;font-size:14px
}
button.secondary,.btn.secondary{background:#294052}
button.success{background:#168653}
button.warn{background:#94651a}
button.danger{background:#8d2d2d}
input,textarea,select{
 width:100%;background:#06131f;color:white;
 border:1px solid #355b76;border-radius:10px;
 padding:12px;margin:7px 0 12px;font-family:inherit
}
textarea{min-height:110px;resize:vertical}
.center{text-align:center}
.hidden{display:none!important}
.small{color:#9eb2c2;font-size:13px}
.msg{padding:12px;border-radius:10px;background:#14334b;margin:10px 0}
.err{background:#4a1d1d}
.ok{background:#154a34}
nav{display:flex;flex-wrap:wrap;gap:5px}
nav button{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.item{background:#0a1927;border:1px solid #294c66;border-radius:12px;padding:14px}
.flag{font-size:42px}
.rule{background:#091724;border-right:3px solid #1976d2;padding:12px;margin:9px 0;border-radius:9px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020a11;padding:14px;border-radius:10px;line-height:1.8}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#14334b;margin:3px}
.hero{
 padding:30px 18px;
 background:linear-gradient(145deg,#071727f5,#12324bf5);
 border:1px solid #d4aa50
}
.hero h1{font-size:clamp(26px,5vw,42px)}
.gold{color:#f4c76a}
.main-link{
 display:block;max-width:360px;margin:20px auto;
 font-size:19px;padding:16px 22px;
 background:linear-gradient(135deg,#b72d24,#e0a52f);
 border:1px solid #f4c76a
}
footer{text-align:center;padding:20px;color:#8fa6b7}
.order-line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #294c66}
@media(max-width:500px){
 .wrap{padding:8px}
 .card{padding:13px}
 nav button{min-width:90px}
}
</style>

function copyText(text){
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text)
   .then(()=>alert("✅ کارت کپی شد."))
   .catch(()=>fallbackCopy(text));
 }else fallbackCopy(text);
}

function fallbackCopy(text){
 const ta=document.createElement("textarea");
 ta.value=text;
 document.body.appendChild(ta);
 ta.select();
 try{
  document.execCommand("copy");
  alert("✅ کارت کپی شد.");
 }catch(e){
  alert("کپی خودکار ممکن نشد؛ متن کارت را دستی انتخاب و کپی کن.");
 }
 ta.remove();
}

function drawItems(){
 const q=$("itemSearch").value.trim();
 const filtered=ITEMS.filter(x=>!q||x.name.includes(q)||x.category.includes(q));
 const groups=[...new Set(filtered.map(x=>x.category))];

 $("itemList").innerHTML=groups.map(group=>`
  <div style="grid-column:1/-1">
   <h3>${esc(group)}</h3>
   <div class="grid">
    ${filtered.filter(x=>x.category===group).map(x=>`
     <button class="item" data-item="${ITEMS.indexOf(x)}">
      ${esc(x.name)}<br>
      <span class="small">قیمت: ${money(x.price)}<br>
      درآمد روزانه: ${money(x.income)}</span>
     </button>`).join("")}
   </div>
  </div>`).join("");

 $("itemSearch").oninput=drawItems;
 $("itemList").onclick=e=>{
  const b=e.target.closest("[data-item]");
  if(!b)return;
  selectedItem=ITEMS[Number(b.dataset.item)];
  showBuyBox();
 };
}

function showBuyBox(){
 $("buyBox").classList.remove("hidden");
 $("buyBox").innerHTML=`
  <div class="item">
   <h2>📦 ${esc(selectedItem.name)}</h2>
   <p>💰 قیمت واحد: ${money(selectedItem.price)}</p>
   <p>📈 درآمد روزانه هر واحد: ${money(selectedItem.income)}</p>
   <label>تعداد</label>
   <input id="buyQty" type="number" min="1" value="1">
   <div id="calc" class="msg"></div>
   <button class="success" id="addOrder">➕ افزودن به سفارش</button>
  </div>
  <div id="orderArea"></div>`;
 $("buyQty").oninput=calcBuy;
 calcBuy();
 $("addOrder").onclick=addOrder;
 renderOrder();
}

function calcBuy(){
 const q=Math.max(0,Number($("buyQty").value||0));
 if(selectedItem.revenue&&q>10){
  $("calc").innerHTML="❌ حداکثر خرید این مورد درآمدزا ۱۰ عدد است.";
  return;
 }
 $("calc").innerHTML=`💰 قیمت کل: <b>${money(q*selectedItem.price)}</b><br>
 💳 درآمد کل روزانه: <b>${money(q*selectedItem.income)}</b>`;
}

function addOrder(){
 const q=Number($("buyQty").value||0);
 if(!Number.isInteger(q)||q<1){
  alert("تعداد معتبر وارد کن.");
  return;
 }
 if(selectedItem.revenue&&q>10){
  alert("❌ حداکثر خرید این مورد درآمدزا ۱۰ عدد است.");
  return;
 }

 const existing=order.find(x=>x.name===selectedItem.name);
 if(existing){
  if(selectedItem.revenue&&existing.qty+q>10){
   alert("مجموع خرید این مورد درآمدزا نمی‌تواند بیشتر از ۱۰ عدد باشد.");
   return;
  }
  existing.qty+=q;
 }else{
  order.push({
   name:selectedItem.name,qty:q,price:selectedItem.price,
   income:selectedItem.income,revenue:selectedItem.revenue
  });
 }
 renderOrder();
 alert("✅ به سفارش اضافه شد.");
}

function removeOrder(index){
 order.splice(index,1);
 renderOrder();
}

function renderOrder(){
 const area=$("orderArea");
 if(!area)return;
 const total=order.reduce((a,x)=>a+x.qty*x.price,0);
 const income=order.reduce((a,x)=>a+x.qty*x.income,0);

 area.innerHTML=`

   <h3>🧾 سفارش فعلی</h3>

     <button class="danger" data-remove="${i}">حذف</button>

   <button class="danger" id="clearOrder" ${order.length?'':'disabled'}>🗑️ پاک کردن سفارش</button>
   <div id="finalOrderArea"></div>
  </div>`;

 area.querySelectorAll("[data-remove]").forEach(b=>{
  b.onclick=()=>removeOrder(Number(b.dataset.remove));

 $("clearOrder").onclick=()=>{

}

🆔 @woorld_warIII`;

 $("finalOrderArea").innerHTML=`

   <pre id="orderText"></pre>

</script>
